{% extends "base.html" %}
{% block title %}New Discussion{% endblock %}

{% block content %}
<h1>Start a Discussion</h1>

<form method="POST" action="{{ url_for('main.new_discussion') }}" class="card-form">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" required>

    <label for="content">Content</label>
    <textarea id="content" name="content" rows="6" required placeholder="Share your question, insight, or topic for discussion..."></textarea>

    <button type="submit" class="btn btn-primary">Post Discussion</button>
</form>
{% endblock %}
